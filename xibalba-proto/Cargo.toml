[package]
name = "xibalba-proto"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "HTTP/1.1 protocol primitives: zero-copy parser, chunked decoder, request serializer"
repository = "https://github.com/42pupusas/xibalba"
keywords = ["http", "parser", "protocol", "no-alloc"]
categories = ["network-programming", "parser-implementations"]

# Test-only. The crate itself has no dependencies and must keep none; this
# exists so the parser can be cross-checked against a widely deployed one,
# and never reaches a consumer of the library.
[dev-dependencies]
httparse = "1.10"
# The fuzz invariants, shared with the libFuzzer targets so both check the
# same properties. Dev-only, like httparse: neither reaches a consumer.
#
# Deliberately a bare path, not the workspace dependency: `xibalba-fuzz` is
# `publish = false`, and a dev-dependency carrying a version makes `cargo
# package` look for it on crates.io and fail. Cargo strips a path-only
# dev-dependency when packaging, which is what lets this crate publish.
xibalba-fuzz = { path = "../xibalba-fuzz" }

[lints]
workspace = true
