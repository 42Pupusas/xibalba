[package]
name = "xibalba-proto"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "HTTP/1.1 protocol primitives: zero-copy parser, chunked decoder, request serializer"
repository = "https://github.com/42pupusas/xibalba"
keywords = ["http", "parser", "protocol", "no-alloc"]
categories = ["network-programming", "parser-implementations"]

# Test-only. The crate itself has no dependencies and must keep none; this
# exists so the parser can be cross-checked against a widely deployed one,
# and never reaches a consumer of the library.
[dev-dependencies]
httparse = "1.10"

[lints]
workspace = true
