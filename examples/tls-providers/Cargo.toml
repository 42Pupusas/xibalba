[package]
name = "tls-providers-bench"
version = "0.1.0"
# Excluded from the workspace (see the root manifest), so these cannot be
# inherited and are restated to match the floor they were held to before.
edition = "2024"
rust-version = "1.91"
publish = false
description = "Benchmarks + adversarial tests comparing rustls crypto providers (ring, aws-lc-rs, rustcrypto)"
autobins = false

[dependencies]
divan = "0.1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "aws_lc_rs"] }
rustls-rustcrypto = "0.0.2-alpha"

[[bench]]
name = "tls_providers"
harness = false

[[test]]
name = "tls_adversarial"
path = "src/bin/tls_adversarial.rs"

# The workspace lint table is likewise out of reach once excluded; these are the
# same lints the root defines, kept in step by hand.
[lints.rust]
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
