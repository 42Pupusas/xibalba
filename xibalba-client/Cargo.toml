[package]
name = "xibalba-client"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Minimal HTTP/1.1 client with redirects, timeouts, streaming bodies, and a caller-supplied TLS connector"
