[workspace]
members = [
    "xibalba-proto",
    "xibalba-client",
    "xibalba-iouring",
    "examples/tcp-rustls",
    "xibalba-benches",
    "xibalba-fuzz",
]
# `examples/tls-providers` compares three rustls crypto providers, and the
# rustcrypto one is an alpha that pins an old `rustls-webpki` and pulls in
# unmaintained `paste` and the timing-vulnerable `rsa`. None of it is reachable
# from the published crates — `xibalba-proto` has no dependencies and
# `xibalba-client` has two — but as a workspace member it sat in the dependency
# graph `cargo deny` audits, so the advisory gate could never be green.
#
# It is excluded rather than deleted: comparing providers is the point of that
# bench, and a provider is not disqualified from a benchmark by being immature.
# It keeps its own lockfile and is built and tested by its own CI job, so the
# coverage is not lost — only the audit scope narrows to what we ship.
# `fuzz` is excluded by cargo-fuzz convention: its targets need nightly and
# build with sanitizer flags the rest of the workspace must not inherit. The
# invariants they drive live in `xibalba-fuzz`, which is a member and is built
# and run by the ordinary gate, so a broken invariant fails `cargo test`
# rather than waiting for a nightly campaign.
exclude = ["examples/tls-providers", "fuzz"]
default-members = [
    "xibalba-proto",
    "xibalba-client",
    "xibalba-iouring",
]
resolver = "3"

# The supported floor, inherited by every member so the number exists once.
# Policy is to track the latest stable release, so the resolver can pick the
# newest dependency versions. `msrv.rs` fails when a manifest or CI drifts
# from this.
[workspace.package]
rust-version = "1.99"
edition = "2024"

[workspace.dependencies]
xibalba-proto = { path = "xibalba-proto", version = "0.4.0" }
xibalba-client = { path = "xibalba-client", version = "0.5.0" }
xibalba-iouring = { path = "xibalba-iouring", version = "0.1.0" }
xibalba-fuzz = { path = "xibalba-fuzz", version = "0.1.0" }
quetzalcoatl = "0.15.0"
ququmatz = "0.17.0"

[workspace.lints.rust]
unreachable_pub = "warn"
# `--cfg loom` selects loom's instrumented atomics in `xibalba-client::sync`.
# It is a cfg rather than a feature because loom must replace `std`'s
# primitives wholesale for a whole build; a feature can be unified on by an
# unrelated crate in the graph, which would silently ship the model checker.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Contradicts rust::unreachable_pub, which we keep: it is the one that catches
# an item exported from the crate root by accident.
redundant_pub_crate = "allow"
