[package]
name = "xibalba"
version = "0.1.0"
edition = "2024"

[features]
default = ["ring"]
ring = ["rustls/ring"]
aws-lc-rs = ["rustls/aws_lc_rs"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "0.26"
quetzalcoatl = { path = "../quetzalcoatl" }
