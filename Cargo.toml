[workspace]
members = [
    "xibalba-proto",
    "xibalba-client",
    "xibalba-iouring",
    "examples/tcp-rustls",
    "examples/tls-providers",
    "xibalba-benches",
]
default-members = [
    "xibalba-proto",
    "xibalba-client",
    "xibalba-iouring",
]
resolver = "3"

[workspace.dependencies]
xibalba-proto = { path = "xibalba-proto", version = "0.2.1" }
xibalba-client = { path = "xibalba-client", version = "0.3.1" }
xibalba-iouring = { path = "xibalba-iouring", version = "0.1.0" }
quetzalcoatl = "0.14.0"
ququmatz = "0.15.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
