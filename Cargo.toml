[workspace]
members = [
    "xibalba-proto",
    "xibalba-client",
    "xibalba-iouring",
    "examples/tcp-rustls",
    "xibalba-benches",
]
default-members = [
    "xibalba-proto",
    "xibalba-client",
    "xibalba-iouring",
]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
