[package]
name = "xibalba-benches"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[features]
dhat-heap = ["dep:dhat"]

[dependencies]
xibalba-proto = { workspace = true }
xibalba-client = { workspace = true }
xibalba-iouring = { workspace = true }
divan = "0.1"
dhat = { version = "0.3", optional = true }

# Comparison-only dependencies for examples/*.rs. Kept as dev-dependencies
# so a normal build of this package (and anything depending on it) never
# pulls in a competing crate — only `cargo run --example ...` does.
[dev-dependencies]
httparse = "1"
http = "1"
url = "2"
ureq = "3"

[[bench]]
name = "response_parse"
harness = false

[[bench]]
name = "request_serialize"
harness = false

[[bench]]
name = "url_parse"
harness = false

[[bench]]
name = "header_helpers"
harness = false

[[bench]]
name = "network"
harness = false

[[bin]]
name = "profile-response-parse"
path = "src/bin/profile_response_parse.rs"

[[bin]]
name = "profile-roundtrip"
path = "src/bin/profile_roundtrip.rs"

[lints]
workspace = true
