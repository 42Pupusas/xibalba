[package]
name = "xibalba-benches"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[features]
dhat-heap = ["dep:dhat"]

[dependencies]
xibalba-proto = { path = "../xibalba-proto" }
xibalba-client = { path = "../xibalba-client" }
io-uring-driver = { path = "../examples/io-uring", package = "io-uring" }
divan = "0.1"
httparse = "1"
http = "1"
url = "2"
ureq = "3"
dhat = { version = "0.3", optional = true }

[[bench]]
name = "response_parse"
harness = false

[[bench]]
name = "request_serialize"
harness = false

[[bench]]
name = "url_parse"
harness = false

[[bench]]
name = "header_helpers"
harness = false

[[bench]]
name = "network"
harness = false

[[bin]]
name = "profile-response-parse"
path = "src/bin/profile_response_parse.rs"

[[bin]]
name = "profile-roundtrip"
path = "src/bin/profile_roundtrip.rs"

[lints]
workspace = true
